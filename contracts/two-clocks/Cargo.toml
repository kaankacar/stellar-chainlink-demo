[package]
name = "two-clocks"
version = "0.1.0"
edition = "2021"
publish = false
description = "Keeps a Chainlink Data Feeds push price and a Data Streams pull price per asset on Stellar"

[lib]
# cdylib only. An rlib here makes cargo skip LTO on the plain
# `cargo build --target wasm32v1-none` path and doubles the wasm.
# The unit tests do not need an rlib.
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "29.0.1", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
hex-literal = "0.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
