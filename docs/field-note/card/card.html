<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Note 02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #efe6d2; }
  body { width: 1600px; height: 1000px; overflow: hidden; }
  .card { position: relative; width: 1600px; height: 1000px; background: #efe6d2; overflow: hidden; }
  .layer { position: absolute; inset: 0; width: 1600px; height: 1000px; pointer-events: none; }
  svg.paper { display: block; }
  .etching {
    position: absolute;
    left: 350px; top: 86px;          /* 900x520, centred in the upper two-thirds */
    width: 900px; height: 520px;
  }
  .caption {
    position: absolute;
    left: 72px; bottom: 72px;
    margin: 0;
    font-family: "Special Elite", "Courier Prime", "Courier New", Courier, monospace;
    font-size: 24px;
    line-height: 1.55;
    color: #2a2520;
    white-space: pre;
    letter-spacing: 0.4px;
  }
  .vignette {
    background: radial-gradient(ellipse 78% 72% at 50% 46%, rgba(0,0,0,0) 55%, rgba(84,62,30,0.11) 100%);
    mix-blend-mode: multiply;
  }
  .fox { position: absolute; border-radius: 50%; filter: blur(7px); mix-blend-mode: multiply; }
  .fox.a { left: 1210px; top: 140px; width: 150px; height: 120px;
           background: radial-gradient(circle, rgba(158,112,52,0.14) 0%, rgba(158,112,52,0.06) 45%, rgba(158,112,52,0) 70%); }
  .fox.b { left: 300px; top: 760px; width: 90px; height: 80px;
           background: radial-gradient(circle, rgba(140,98,46,0.12) 0%, rgba(140,98,46,0) 68%); }
  .fox.c { left: 980px; top: 820px; width: 60px; height: 52px;
           background: radial-gradient(circle, rgba(140,98,46,0.10) 0%, rgba(140,98,46,0) 68%); }
</style>
</head>
<body>
<div class="card">

  <!-- Paper: base tone, large-scale mottling, fibre grain -->
  <svg class="layer paper" viewBox="0 0 1600 1000" width="1600" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.0040" numOctaves="3" seed="4" result="n"/>
        <feColorMatrix in="n" type="matrix"
          values="0 0 0 0 0.62
                  0 0 0 0 0.50
                  0 0 0 0 0.28
                  1.4 0 0 0 -0.52"/>
      </filter>
      <filter id="fibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.95 0.22" numOctaves="2" seed="17" result="f"/>
        <feColorMatrix in="f" type="matrix"
          values="0 0 0 0 0.35
                  0 0 0 0 0.28
                  0 0 0 0 0.18
                  0.9 0 0 0 -0.30"/>
      </filter>
      <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="29" result="g"/>
        <feColorMatrix in="g" type="matrix"
          values="0 0 0 0 0.30
                  0 0 0 0 0.24
                  0 0 0 0 0.16
                  0.8 0 0 0 -0.28"/>
      </filter>
    </defs>
    <rect width="1600" height="1000" fill="#efe6d2"/>
    <rect width="1600" height="1000" filter="url(#mottle)" opacity="0.22"/>
    <rect width="1600" height="1000" filter="url(#fibre)" opacity="0.30"/>
    <rect width="1600" height="1000" filter="url(#grain)" opacity="0.22"/>
  </svg>

  <!-- Foxing -->
  <div class="fox a"></div>
  <div class="fox b"></div>
  <div class="fox c"></div>

  <!-- Etching: a wall clock (push) and a stopwatch with a seal (pull) feeding one Stellar ledger row -->
  <svg class="etching" viewBox="40 60 820 400" width="900" height="520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- roughen every stroke a little, like ink on fibre -->
      <filter id="rough" x="-4%" y="-6%" width="108%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="11" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- stamp coverage: coarse patches of weak ink plus fine pitting -->
      <filter id="stampnoise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.026" numOctaves="4" seed="5" result="coarse"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="21" result="fine"/>
        <feComposite in="coarse" in2="fine" operator="arithmetic" k1="0" k2="0.56" k3="0.44" k4="0" result="mix"/>
        <feColorMatrix in="mix" type="matrix"
          values="3.0 0 0 0 -0.62
                  3.0 0 0 0 -0.62
                  3.0 0 0 0 -0.62
                  0   0 0 0  1"/>
      </filter>
      <mask id="stamp" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="520">
        <rect width="900" height="520" fill="#fff" filter="url(#stampnoise)"/>
      </mask>
    </defs>

    <g mask="url(#stamp)" opacity="0.88">
      <g filter="url(#rough)" fill="none" stroke="#1f1b16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

        <!-- Push clock: a wall clock with a heartbeat trace under it -->
        <circle cx="186" cy="250" r="78"/>
        <circle cx="186" cy="250" r="70" stroke-width="2.4"/>
        <g stroke-width="3.2">
          <path d="M 186 184 L 186 194"/><path d="M 252 250 L 242 250"/><path d="M 186 316 L 186 306"/><path d="M 120 250 L 130 250"/>
          <path d="M 219 193 L 215 200"/><path d="M 243 283 L 236 279"/><path d="M 153 307 L 157 300"/><path d="M 129 217 L 136 221"/>
        </g>
        <path d="M 186 250 L 186 204" stroke-width="4.6"/>
        <path d="M 186 250 L 222 268" stroke-width="4.6"/>
        <circle cx="186" cy="250" r="4.5" fill="#1f1b16" stroke="none"/>
        <text x="186" y="298" font-family="'Special Elite', Courier, monospace" font-size="18" letter-spacing="3" text-anchor="middle" fill="#1f1b16" stroke="none">24H</text>
        <!-- heartbeat trace -->
        <path d="M 96 372 L 140 372 L 152 348 L 166 398 L 178 360 L 188 372 L 232 372 L 244 352 L 256 390 L 266 372 L 290 372"/>
        <text x="192" y="426" font-family="'Special Elite', Courier, monospace" font-size="20" letter-spacing="5" text-anchor="middle" fill="#1f1b16" stroke="none">PUSH</text>

        <!-- Pull clock: a stopwatch with a wax seal and a signature -->
        <path d="M 414 164 Q 430 160 446 164 L 446 176 Q 430 174 414 176 Z"/>
        <path d="M 430 176 L 430 190"/>
        <path d="M 474 196 L 486 184"/>
        <circle cx="430" cy="250" r="62"/>
        <circle cx="430" cy="250" r="54" stroke-width="2.4"/>
        <g stroke-width="3">
          <path d="M 430 198 L 430 206"/><path d="M 482 250 L 474 250"/><path d="M 430 302 L 430 294"/><path d="M 378 250 L 386 250"/>
        </g>
        <path d="M 430 250 L 452 214" stroke-width="4.4"/>
        <circle cx="430" cy="250" r="4" fill="#1f1b16" stroke="none"/>
        <!-- wax seal over the lower right rim -->
        <path d="M 512 300 Q 516 318 503 331 Q 495 348 476 350 Q 458 356 444 345 Q 426 342 420 326 Q 410 312 416 296 Q 414 280 428 270 Q 440 256 458 260 Q 476 256 489 268 Q 508 276 512 300 Z"/>
        <path stroke-width="3.2" d="M 440 318 C 446 296 458 288 460 300 C 461 310 450 320 452 322 C 458 320 470 300 480 296 C 490 294 486 310 484 318"/>
        <text x="464" y="372" font-family="'Special Elite', Courier, monospace" font-size="18" letter-spacing="3" text-anchor="middle" fill="#1f1b16" stroke="none">F+1</text>
        <text x="436" y="426" font-family="'Special Elite', Courier, monospace" font-size="20" letter-spacing="5" text-anchor="middle" fill="#1f1b16" stroke="none">PULL</text>

        <!-- dashed arrows into the ledger -->
        <path d="M 268 214 Q 420 108 596 206" stroke-dasharray="17 11"/>
        <path d="M 580 188 Q 596 198 610 208 Q 594 216 580 226"/>
        <path d="M 520 272 Q 556 282 598 300" stroke-dasharray="17 11"/>
        <path d="M 586 284 Q 600 294 612 302 Q 596 308 582 318"/>

        <!-- Stellar ledger box: one row, two columns -->
        <path d="M 626 152 Q 736 148 848 153 Q 853 262 847 372 Q 736 376 625 371 Q 620 262 626 152 Z"/>
        <text x="736" y="188" font-family="'Special Elite', Courier, monospace" font-size="21" letter-spacing="5" text-anchor="middle" fill="#1f1b16" stroke="none">STELLAR</text>
        <text x="736" y="216" font-family="'Special Elite', Courier, monospace" font-size="21" letter-spacing="5" text-anchor="middle" fill="#1f1b16" stroke="none">LEDGER</text>
        <path d="M 636 232 Q 736 229 838 233"/>
        <text x="644" y="266" font-family="'Special Elite', Courier, monospace" font-size="19" letter-spacing="3" text-anchor="start" fill="#1f1b16" stroke="none">XLM/USD</text>
        <path d="M 642 280 Q 736 278 832 281"/>
        <path d="M 736 282 L 736 372" stroke-width="2.6"/>
        <text x="688" y="312" font-family="'Special Elite', Courier, monospace" font-size="17" letter-spacing="3" text-anchor="middle" fill="#1f1b16" stroke="none">PUSH</text>
        <text x="786" y="312" font-family="'Special Elite', Courier, monospace" font-size="17" letter-spacing="3" text-anchor="middle" fill="#1f1b16" stroke="none">PULL</text>
        <path d="M 642 324 Q 736 322 832 325"/>
        <path d="M 652 346 Q 688 344 724 347"/>
        <path d="M 748 346 Q 786 344 822 347"/>
        <path d="M 644 382 Q 736 385 830 382"/>
        <path d="M 662 392 Q 736 395 812 392"/>
      </g>
    </g>
  </svg>

  <!-- Caption -->
  <p class="caption">Chainlink on Stellar
No. 03
read / verify / compare
2026</p>

  <!-- Torn right edge, very faint -->
  <svg class="layer" viewBox="0 0 1600 1000" width="1600" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="tear" x="-2%" y="-2%" width="104%" height="104%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="3" seed="8" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="14" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <g filter="url(#tear)">
      <path d="M 1591 -10 L 1612 -10 L 1612 1010 L 1591 1010 Z" fill="#f8f2e4" opacity="0.9"/>
      <path d="M 1591 -10 L 1591 1010" stroke="#6b5a3e" stroke-width="1.2" opacity="0.16" fill="none"/>
    </g>
  </svg>

  <!-- Vignette -->
  <div class="layer vignette"></div>
</div>
</body>
</html>
